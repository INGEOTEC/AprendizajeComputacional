name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
          tinytex: true

      # Execution results are frozen (_freeze/), so publishing needs neither
      # Python nor the TextClassification datasets it downloads at render
      # time. Run scripts/render.py locally before pushing to keep the
      # committed freeze cache in sync with the .qmd sources — if it drifts,
      # this job has no Python to fall back on and will fail.
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
