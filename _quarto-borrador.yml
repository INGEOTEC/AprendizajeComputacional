# Perfil del borrador (rama develop), publicado en /dev/.
# Uso: quarto render --profile borrador
# Para probarlo localmente, mandar la salida fuera de _book/ (que está
# versionado): quarto render --profile borrador --to html --output-dir <tmp>
#
# El aviso va con include-before-body porque `book.announcement` no se aplica
# a proyectos de tipo libro en Quarto 1.10.
book:
  site-url: https://ingeotec.github.io/AprendizajeComputacional/dev

format:
  html:
    include-in-header:
      text: |
        <meta name="robots" content="noindex">
    include-before-body:
      text: |
        <div id="aviso-edicion" class="alert alert-warning text-center mb-0 rounded-0" role="alert">
        <strong>Borrador en preparación</strong> (rama <code>develop</code>): el contenido puede cambiar. La edición vigente está en <a href="https://ingeotec.github.io/AprendizajeComputacional/">https://ingeotec.github.io/AprendizajeComputacional/</a>
        </div>
